<style>
  :root{ --bg:#0b1020; --card:#16203a; --card2:#1b2949; --line:#263456; --text:#e8edf7; --muted:#9aa7c4; --brand:#5b8cff; --green:#2dd4a7; }
  *{box-sizing:border-box} body{margin:0;font-family:"Pretendard",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:880px;margin:0 auto;padding:34px 18px 70px}
  h1{font-size:clamp(22px,4vw,30px);letter-spacing:-.6px;margin:0 0 6px}
  .lead{color:var(--muted);font-size:14.5px;margin:0 0 8px}
  .how{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:#cdd6ea;margin:14px 0 26px}
  .how b{color:var(--text)}
  .post{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:22px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .num{flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(100deg,var(--brand),#7c5cff);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
  input.ttl{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14.5px;font-weight:700;font-family:inherit}
  textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:#e8edf7;border-radius:11px;padding:13px 14px;font-size:14px;line-height:1.75;font-family:inherit;resize:vertical}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  input.tags{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 11px;font-size:12.5px;font-family:inherit}
  button.cp{background:var(--card2);border:1px solid var(--line);color:#cfe0ff;font-weight:700;border-radius:9px;padding:9px 13px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
  button.cp:hover{border-color:var(--brand);color:#fff}
  button.cp.ok{background:var(--green);color:#06281f;border-color:transparent}
  a{color:#9cb8ff}
</style>

<div class="wrap">
  <h1>네이버 블로그용 글 모음 (복붙용)</h1>
  <p class="lead">아래 글을 하나씩 네이버 블로그에 새 글로 올리세요. 각 항목의 [제목 복사] · [본문 복사] · [태그 복사] 버튼만 누르면 됩니다.</p>
  <div class="how">
    <b>사용법</b> &nbsp;1) 블로그 글쓰기 &nbsp; 2) 제목 복사 → 제목칸 &nbsp; 3) 본문 복사 → 본문 &nbsp; 4) 태그 복사 → 태그칸 &nbsp; 5) 발행<br>
    본문 끝에 사이트로 가는 링크가 들어 있어, 방문자가 계산기·실시간 차트가 있는 페이지로 이동합니다. 하루 1~2개씩 순서대로 올리면 시리즈가 됩니다.
  </div>
  <div id="posts"></div>
</div>

<script>
  var SITE = "https://retire-tax-plan.vercel.app/";
  var POSTS = [
  {t:"연금·ISA·미국주식으로 노후 세금 줄이기 — '폭포수' 전략 한눈 정리 (2026)", a:"", g:"노후준비,연금저축,IRP,ISA,미국주식,절세,세액공제,재테크",
   b:"노후 준비는 얼마를 버느냐만큼 세금을 얼마나 덜 내느냐가 수익률을 가릅니다. 큰 그림은 의외로 단순해요. 세금 혜택이 큰 계좌부터 차례로 채우는 '폭포수' 방식입니다.\n\n순서는 이렇습니다.\n- 1순위 연금저축+IRP, 1인당 연 900만원. 세액공제율이 13.2~16.5%라 맞벌이가 각자 채우면 한 해 약 297만원을 돌려받아요.\n- 2순위 중개형 ISA, 연 2,000만원. 비과세에 손익통산까지 됩니다.\n- 3순위 남는 목돈은 미국주식 직접투자. 양도세 22% 분리과세로 끝나고 건강보험료엔 잡히지 않습니다.\n\n흐름도 네 단계로 보면 쉬워요. 오늘은 연금계좌에 1만원만 넣어 '5년 타이머'를 켜둡니다. 그다음 폭포수 순서대로 모으면서 국내상장 미국ETF를 사고, 자산이 커지면 부부 분산과 배당 999만원 선 관리로 건보료를 피합니다. 55세가 지나면 3.3~5.5% 저율로 빼 쓰면 되고요.\n\n계좌 안에서는 TIGER 미국S&P500 같은 국내상장 미국ETF(이름에 H 없는 환노출)를 삽니다. 똑같은 걸 일반계좌에서 사면 배당세 15.4%에 건보료까지 붙거든요."},

  {t:"노후 절세, 오늘 연금저축에 1만원부터 넣으세요 (5년 타이머)", a:"day0", g:"연금저축,IRP,연금계좌개설,5년타이머,노후준비,절세",
   b:"노후 절세는 시간 싸움이 절반입니다. 오늘 당장 할 수 있는 건 딱 하나예요. 연금저축이나 IRP 계좌를 열고 1만원을 넣는 겁니다.\n\n연금을 3.3~5.5% 저율로 빼 쓰려면 가입 5년에 만 55세 조건을 채워야 하는데, 이 5년은 첫 입금일부터 셉니다. 나중에 목돈을 넣어도 소급이 안 되니 출발선을 지금 끊어두는 게 핵심이죠. 1,000원만 넣어도 되지만 잔고가 너무 적으면 휴면계좌로 잠길 수 있어서 1만원을 권합니다.\n\n이게 왜 강력하냐면, 5년이 지난 뒤 ISA에서 굴리던 1억을 연금계좌로 옮겨도 국세청이 그 1억까지 '5년 채운 돈'으로 봐줘요. 이미 55세가 넘었다면 넣은 그달부터 매달 저율로 받을 수 있고요.\n\n증권사 앱에서 연금저축펀드를 검색해 비대면으로 열고 1만원만 넣으세요. 5분이면 끝납니다."},

  {t:"폭포수 납입 순서와 환노출 미국ETF 고르는 법", a:"waterfall", g:"미국ETF,환노출,TIGER미국S&P500,연금저축,ISA,환헤지,절세",
   b:"투자할 돈이 적든 많든, 물통을 위에서부터 채우듯 순서대로 넣으면 됩니다.\n\n연금저축과 IRP에 900만원을 먼저 채워 세액공제를 받고, 남으면 ISA 2,000만원, 그래도 남으면 미국주식 직투로 갑니다.\n\n계좌 안에서 뭘 사느냐가 중요해요. 연금과 ISA 안에서는 TIGER 미국S&P500이나 TIGER 미국나스닥100 같은 국내상장 미국ETF를 삽니다. 같은 상품이라도 일반계좌에서 사면 배당세 15.4%를 떼고, 수익이 1,000만원을 넘으면 건강보험료에 그대로 반영되거든요.\n\n그리고 이름 끝에 H가 없는 환노출 상품을 고르세요. 위기로 증시가 빠질 때 달러가 오르면서 손실을 덜어주는 방어막이 됩니다. 환헤지 비용도 안 들고요. 국내상장 미국ETF는 앱에 찍힌 원화 가격에 환율이 이미 반영돼 있어 팔 때 환율을 따로 계산할 필요도 없습니다.\n\n부부라면 각자 명의로 나눠 한도를 두 배로 키울 수 있어요. 연금 1,800만원에 ISA 4,000만원이 됩니다."},

  {t:"ISA 만기 30일 안에 안 팔면 세금 폭탄 (꼭 알아둘 함정)", a:"skills", g:"ISA,ISA만기,비과세,금융소득종합과세,풍차돌리기,절세,세금",
   b:"ISA의 비과세 혜택은 만기 처리 한 번 잘못하면 다 날립니다. 의외로 많이 놓치는 함정이라 따로 정리해요.\n\n만기일로부터 30일 안에 계좌 안의 ETF와 주식을 전부 팔아 현금으로 바꾸지 않으면, ISA가 일반 위탁계좌로 자동 전환됩니다. 그때부터 생긴 수익에는 15.4% 세금이 붙어요. 국내상장 해외ETF 차익은 배당소득으로 잡히고, 한 해 금융소득이 2,000만원을 넘으면 종합과세까지 갑니다. 같은 5,000만원 수익이라도 세금이 600만원 넘게 차이 날 수 있어요.\n\n대응은 어렵지 않아요. 매도하고 예수금이 들어오기까지 2~3일 걸리니 만기 며칠 전에 미리 파세요. 더 굴리고 싶으면 만기 3개월 전부터 하루 전까지 만기 연장을 신청하면 됩니다. 의무가입 3년을 이미 채웠다면 페널티 없이 해지하고, 그 돈을 곧바로 연금계좌로 옮기는 풍차돌리기로 이어가는 게 가장 깔끔하고요."},

  {t:"DC형 퇴직연금, 뭘 사야 하나 (70/30 규제·TDF·채권혼합)", a:"dcpension", g:"퇴직연금,DC형,IRP,TDF,채권혼합ETF,위험자산70,미국나스닥100",
   b:"퇴직연금을 DC형으로 바꾸면 직접 굴려야 합니다. 사는 건 똑같이 국내상장 미국 지수ETF인데, 규제 하나만 알면 돼요.\n\n퇴직연금(DC·IRP)은 주식형 같은 위험자산을 70%까지만 담고 나머지 30%는 안전자산으로 채워야 합니다. 개인형 IRP도 마찬가지고요. 연금저축펀드만 이 규제가 없어 100% 주식형이 됩니다.\n\n방법은 세 가지예요. 직접 굴린다면 미국S&P500·나스닥100 ETF 70%에 국고채·미국채 ETF 30%를 섞습니다. 신경 쓰기 싫으면 적격 TDF로 100%를 채워도 돼요. TDF는 70% 한도 예외라 KODEX TDF2050액티브처럼 먼 빈티지 하나로 알아서 굴러갑니다. 더 공격적으로 가려면 지수형 채권혼합 ETF를 안전자산 자리에 넣는 방법이 있어요. 주식이 최대 50% 들어 있어도 안전자산으로 분류돼서, 계좌 전체 주식 비중을 이론상 85%까지 끌어올립니다(예: 1Q·ACE 미국나스닥100미국채혼합50액티브).\n\n주의할 점이 있어요. 퇴직연금에선 개별 미국주식을 직접 못 사고(ETF·펀드·예금만), 레버리지·인버스도 금지입니다. 디폴트옵션에 맡기지 말고 직접 매수 지시를 넣으세요. TDF 뒤 숫자는 은퇴 목표연도라, 2050이면 2050년쯤 은퇴할 사람용입니다."},

  {t:"왜 미국주식 직투인가 — 1억을 벌어도 건보료 0원", a:"whyus", g:"미국주식,양도소득세,분리과세,건강보험료,종합과세,SCHD,절세",
   b:"ISA와 연금 한도를 다 채운 뒤 남는 목돈을 미국주식 직투에 넣는 데는 이유가 있어요.\n\n먼저 세금입니다. 미국주식 양도차익은 22% 분리과세로 끝나요. 1억을 벌든 10억을 벌든 건강보험료에 반영되지 않고 피부양자 자격도 그대로입니다. 수익이 클수록 오히려 유리한데, 연 833만원 이하면 250만원 기본공제로 세금이 거의 없고, 2,000만원을 넘기면 국내 금융소득종합과세(최고 49.5%)를 피해 22%로 끝낼 수 있어요.\n\n기업 자체도 강합니다. 애플이나 마이크로소프트는 번 돈으로 자사주를 사서 태워요. 주식 수가 줄어드니 내 한 주의 가치가 가만히 있어도 오르죠. 환노출이라 폭락장에서 달러 강세가 손실을 덜어주는 것도 덤이고요.\n\n다만 순서는 지키세요. 미장 직투는 어디까지나 3순위입니다. 세액공제(연금)와 비과세(ISA)부터 챙기고, 남는 돈으로 가는 거예요."},

  {t:"건강보험료·종합과세 피하는 법 (부부분산·배당 999만원·임의계속가입)", a:"skills", g:"건강보험료,피부양자,배당소득,종합과세,부부분산,임의계속가입,SCHD",
   b:"자산이 커지면 세금보다 건보료 폭탄과 종합과세 합산이 더 무섭습니다. 미리 설계해두면 피할 수 있어요.\n\n한국 세금과 건보료는 철저히 개인별로 매깁니다. 그래서 부부가 자산을 반씩 나누면 ISA 방어막이 2억(각 1억)이 되고 연금·배당 한도도 두 배가 되죠.\n\n일반계좌에서 SCHD나 JEPQ 같은 미국 배당주를 살 땐 배당을 1인당 세전 999만원 안쪽으로 맞추세요. 1,000만원을 넘기는 순간 전액이 소득에 합산돼 지역가입자 건보료가 확 뜁니다. 부부가 각자 999만원이면 합쳐서 한 해 약 2,000만원, 월 166만원을 건보료 걱정 없이 만들 수 있어요.\n\n은퇴 직후가 진짜 고비입니다. 퇴직하면 임의계속가입을 신청하세요. 최대 36개월 동안 직장 다닐 때 수준의 보험료를 유지해줍니다. 첫 지역보험료 고지서 납기일로부터 2개월 안에 신청해야 하니 놓치지 마시고요. 참고로 미국주식 양도세와 사적연금은 건보료에 안 잡힙니다."},

  {t:"연금, 한 해에 얼마까지 빼야 세금이 안 터지나", a:"withdraw", g:"연금수령,연금소득세,1500만원,종합과세,분리과세,연금인출,은퇴",
   b:"연금을 받을 때 세금 없이 얼마까지 빼도 되는지 헷갈리시죠. 벽이 두 개 있는데, 둘 중 낮은 쪽이 안전선입니다.\n\n첫째는 연금수령한도예요. 계산식은 평가액을 (11 빼기 연금수령연차)로 나눈 뒤 120%를 곱하는 겁니다. 이 안에서 빼야 저율과 감면이 유지되고, 넘기면 초과분에 기타소득세 16.5%가 붙어요. 그래서 한 번에 빼지 말고 10년 넘게 쪼개 받는 게 좋습니다. 참고로 이 연차는 만 55세에 월 1만원으로라도 연금을 개시해두면 미리 쌓아둘 수 있어요.\n\n둘째는 연 1,500만원입니다. 연금저축·IRP의 과세분 합계가 1,500만원(월 약 125만원)을 넘으면 초과분을 종합과세할지 16.5% 분리과세할지 골라야 해요. 다른 소득이 적은 은퇴자라면 1,500을 넘겨도 종합과세가 더 쌀 때가 많습니다. 적용세율이 26.4% 이하면 종합이 유리하거든요.\n\n헷갈리기 쉬운 부분 하나. 이 1,500만원은 사적연금만 따집니다. 국민연금 같은 공적연금은 별개로 무조건 종합과세고, 퇴직금 재원도 따로예요. 연금소득세율은 55~69세 5.5%, 70~79세 4.4%, 80세부터 3.3%입니다."},

  {t:"연금은 55세부터 딱 1만원씩만 받으세요 (연차 시계 켜기)", a:"age55", g:"연금수령연차,연금수령한도,퇴직소득세,IRP,연금저축,55세,연금개시,은퇴",
   b:"돈이 급하지 않아도 만 55세가 되면 연금을 개시해서 월 1만원씩 받아두라는 말, 들어보셨을 거예요. 처음엔 뭐 하러 그러나 싶은데 이유를 알고 나면 안 할 이유가 없습니다.\n\n연금계좌에서 3.3~5.5%짜리 저율과세로 뺄 수 있는 금액엔 상한이 있어요. 연금수령한도라고 하는데, 계산식이 평가액을 (11 빼기 연금수령연차)로 나눈 뒤 120%를 곱하는 구조입니다. 여기서 분모가 매년 1씩 줄어요. 1년차면 11에서 1을 뺀 10으로 나누니 계좌의 12%, 5년차면 6으로 나누니 20%, 10년차면 1로 나누니 사실상 전액입니다. 그리고 11년차부터는 한도가 아예 사라져요.\n\n중요한 건 이 연차가 연금개시를 신청한 해부터 쌓인다는 겁니다. 55세에 월 1만원으로 시작해두면 65세엔 이미 11년차예요. 그때 목돈 5,000만원이 필요해도 한도 걱정 없이 저율로 뺄 수 있습니다. 반대로 개시를 안 해뒀으면 한도를 넘긴 금액에 기타소득세 16.5%가 붙어요. 세금 차이가 수백만원까지 벌어집니다.\n\n퇴직금을 IRP로 받아둔 분이라면 이득이 하나 더 있어요. 퇴직금을 연금으로 나눠 받으면 퇴직소득세를 깎아주는데, 2026년 1월 1일 수령분부터 감면 구간이 3단계로 늘었습니다. 실제 수령연차 10년 이하면 30% 감면, 10년 초과 20년 이하면 40% 감면, 20년을 넘기면 50% 감면이에요. 20년 초과 구간이 올해 새로 생긴 겁니다. 아직 옛날 2단계로만 설명하는 글이 많으니 확인해보세요.\n\n그런데 여기서 사람들이 제일 많이 놓치는 함정이 있습니다. 연차가 두 종류예요. 인출 한도를 계산할 때 쓰는 연금수령연차는 개시한 해부터 달력으로 자동으로 쌓입니다. 반면 퇴직소득세 감면에 쓰는 실제 연금수령연차는 진짜로 연금을 받은 해만 세요. 개시만 해두고 몇 년 쉬면 그 해는 카운트가 안 됩니다. 그러니까 개시한 뒤엔 금액이 얼마든 매년 최소 한 번은 꼭 받으세요. 월 1만원 자동수령을 걸어두라는 이유가 정확히 이겁니다.\n\n실행할 때 챙길 것도 몇 가지 있어요. 첫째, 그냥 출금하는 건 중도인출이라 연차가 안 쌓입니다. 앱에서 연금 수령 개시 신청을 정식으로 해야 해요. 둘째, 개시한 계좌는 보통 추가납입이 막힙니다. 세액공제를 계속 받아야 한다면 계좌를 둘로 나누세요. 하나는 55세에 개시해서 월 1만원 받는 연차 적립용, 다른 하나는 계속 납입하는 세액공제용으로요. 금융사마다 규정이 다르니 개시 전에 물어보시고요. 셋째, 2013년 3월 1일 이전에 가입한 계좌는 연차를 6년차부터 기산하는 특례가 있어서 오히려 더 유리합니다. 묵혀둔 옛날 계좌 있으면 가입일부터 확인해보세요.\n\n정리하면 이래요. 연금소득세율은 55~69세 5.5%, 70~79세 4.4%, 80세부터 3.3%로 늦게 받을수록 낮습니다. 그러니 연차는 55세에 미리 켜두고, 실제 목돈 인출은 70세 이후로 미루는 게 가장 좋은 조합이에요. 한도 제한은 사라지고 세율은 4.4%까지 내려간 구간에서 빼는 거죠."},

  {t:"연금 고수들의 인출 비기 (풍차돌리기·비과세 비상금·퇴직금 연금수령)", a:"mastertips", g:"풍차돌리기,ISA연금전환,퇴직소득세,IRP,연금저축,추가세액공제,은퇴",
   b:"한 단계 위의 기술들을 모아봤어요.\n\nISA를 3년 만기에 해지하고 통째로 연금계좌로 옮기는 풍차돌리기가 있습니다. 1,800만원 한도와 상관없이 전액 넣을 수 있고, 옮긴 금액의 10%(최대 300만원)를 추가로 세액공제까지 받아요.\n\n연금계좌에서 돈이 빠지는 순서도 알아두면 좋습니다. 세액공제를 안 받은 원금이 먼저 나오고(비과세), 그다음이 퇴직금 재원, 마지막이 세액공제 받은 원금과 수익이에요. 그래서 세액공제 한도(900만)를 넘겨 더 넣어둔 돈은 언제든 세금 없이 빼 쓸 수 있어 비상금 통장처럼 됩니다.\n\n퇴직금은 일시금으로 받지 말고 IRP에 넣어 연금으로 받으세요. 실제 수령연차가 10년 이하면 퇴직소득세의 70%만, 10년 초과 20년 이하면 60%만, 20년을 넘기면 50%만 냅니다. 30%에서 50%까지 아끼는 셈이죠. 20년 초과 구간은 2026년 1월 1일 수령분부터 새로 생겼어요. 연금소득이라 건보료에도 안 잡히고요. 국민연금은 최대 5년 미루면 해마다 7.2%씩, 최대 36%를 더 받습니다."},

  {t:"미국주식 양도세 줄이는 3가지 기술과 배우자 증여 (2025 이월과세 주의)", a:"skills", g:"미국주식절세,양도소득세,배우자증여,이월과세,손익통산,250만원공제",
   b:"미국주식 직투에서 22% 양도세를 합법적으로 줄이는 방법입니다.\n\n연말에 수익 250만원어치만 팔았다가 다음 날 다시 사세요. 해마다 기본공제 250만원을 비과세로 챙기는 겁니다. 손실 난 종목이 있으면 연말에 같이 팔아 전체 순수익을 깎는 것도 방법이고요.\n\n크게 오른 종목은 배우자에게 증여하면 취득단가가 시세로 리셋됩니다. 10년에 6억까지 증여세가 없으니까요. 그런데 여기서 꼭 알아야 할 게 있어요. 2025년 1월 1일 이후 증여분부터는 해외주식도 이월과세 대상이라, 증여하고 1년 안에 팔면 증여한 사람의 원래 취득가로 계산돼 효과가 사라집니다. 반드시 1년은 넘게 들고 있다 파세요. 2024년 증여분까지는 바로 팔아도 됐는데 규정이 바뀌었습니다."},

  {t:"미국주식 양도세, 250만원 공제 100% 써먹는 법 (수시로 팔아야 하나요?)", a:"faq", g:"미국주식,해외주식양도세,250만원공제,분리과세,손익통산,배우자증여,절세",
   b:"연금·IRP·ISA를 다 채우고 미국주식 직투까지 하는 분들이 자주 묻는 게 있어요. 250만원 빼고 22% 내는 거면, 250만원 수익 날 때마다 수시로 팔아야 하냐는 거죠.\n\n결론부터 말하면 수시로 팔 필요는 없습니다. 그리고 한 가지 짚고 갈게요. 250만원은 세금이 아니라 수익에서 빼주는 공제예요. 그 해 양도차익에서 250만원을 뺀 금액에만 22%가 붙습니다. 수익이 250만원이면 세금 0원, 1,000만원이면 (1,000−250)×22%로 165만원인 식이죠. 이 공제는 해마다 새로 생기고 안 쓰면 사라져요. 그래서 자주 파는 게 아니라 해마다 250만원어치 이익을 실현해 두는 게 포인트입니다.\n\n실전은 이래요. 연말에 그 해 실현이익을 확인하고, 250만원을 안 썼으면 이익 난 종목을 250만원어치만큼 팝니다. 계속 들고 갈 종목이면 며칠 뒤 다시 사면 돼요. 미국주식은 곧바로 다시 사도 한국 양도세에선 문제가 없습니다. 이렇게 하면 그 해 세금은 0원이고, 다시 살 때 취득단가가 올라가서 나중에 한꺼번에 팔 때 세금이 확 줄어듭니다. 보통 연말에 한 번만 정리하면 충분해요.\n\n조금이라도 더 아끼는 방법도 있어요. 부부가 각자 계좌로 투자하면 250만원씩, 합쳐서 한 해 500만원까지 공제됩니다. 손실 난 종목이 있으면 같은 해에 팔아 이익과 상계하면 순이익이 줄고요. 큰 차익은 한 해에 몰지 말고 두 해로 나눠 실현하면 250만원 공제를 두 번 쓸 수 있어요. 올해 250만원어치, 내년 초에 또 250만원어치 식으로요. 같은 종목을 12월 31일에 팔고 1월 1일에 사라는 뜻이 아니라(1월 1일은 한국도 미국도 휴장입니다) 차익을 두 해에 걸쳐 나누라는 거예요. 다만 미국주식은 결제일(매매 다음 영업일) 기준으로 연도가 갈리니, 12월 말일에 임박해서 팔면 결제가 내년으로 넘어갈 수 있어요. 12월 중하순에 여유 있게 파는 게 안전합니다. 아주 크게 오른 종목은 배우자에게 증여(10년 6억까지 비과세)한 뒤 1년 넘게 보유했다 팔면 취득가가 시세로 리셋돼요. 2025년부터는 증여 후 1년 안에 팔면 효과가 사라지니 1년은 꼭 채우시고요.\n\n참고로 미국주식 양도세는 22% 분리과세라 아무리 많이 벌어도 건강보험료나 종합과세에는 잡히지 않습니다. 신고는 매년 5월에 하면 돼요. 팔았다 다시 살 때 가격과 환율이 조금씩 움직이고 수수료도 드니, 정확히 250만원이 아니라 그 근처로만 맞추면 됩니다."},

  {t:"연금저축 900만원 넘게 넣었다면 — 납입연도 전환특례 꼭 신청하세요", a:"skills", g:"연금저축,IRP,세액공제,납입연도전환특례,연말정산,900만원,절세",
   b:"연금저축과 IRP는 한 해에 1,800만원까지 넣을 수 있는데, 세액공제는 900만원까지만 됩니다. 그래서 여유가 있어서 1,500만원쯤 넣은 분들이 있어요. 초과한 600만원은 그냥 날아가는 걸까요.\n\n아닙니다. 납입연도 전환특례라는 제도가 있어요. 작년에 한도를 넘겨 넣은 금액을 올해 납입한 걸로 바꿔서 올해 세액공제를 받는 겁니다. 소득세법 시행령 118조의3에 근거가 있고, 신청만 하면 됩니다.\n\n대상은 두 가지예요. 첫째, 한도 900만원을 초과해서 납입한 금액. 둘째, 산출세액이 적어서 세액공제를 다 못 받고 남은 금액입니다. 소득이 적은 해에는 낼 세금 자체가 적어서 공제를 못 받는 경우가 있거든요. 이런 금액들도 다음 해로 넘길 수 있습니다.\n\n신청은 계좌가 있는 증권사나 은행에 하면 됩니다. 전환 처리가 끝나면 연금납입확인서를 발급받아 연말정산이나 종합소득세 신고에 제출하면 돼요. 주의할 점은 전환된 금액도 결국 그 해 900만원 한도 안에서만 공제된다는 겁니다. 올해 이미 900만원을 다 채웠다면 전환해봐야 소용이 없어요. 그러니까 올해는 좀 적게 넣고 작년 초과분을 끌어오는 식으로 계산해서 쓰는 게 맞습니다.\n\n의외로 모르는 분이 많아서 그냥 버려지는 돈이 꽤 됩니다. 900만원 넘게 넣어보신 적 있다면 증권사에 한 번 문의해보세요."},

  {t:"ISA 서민형은 가입 타이밍이 전부입니다 (비과세 400만원)", a:"skills", g:"ISA,서민형ISA,비과세,총급여5000만원,절세,사회초년생,재테크",
   b:"ISA는 서민형이냐 일반형이냐에 따라 비과세 한도가 두 배 차이 납니다. 일반형은 200만원, 서민형은 400만원이에요. 그런데 이 자격이 언제 정해지는지 아시나요.\n\n가입하거나 만기 연장하는 시점의 직전 연도 소득으로 딱 한 번 판정합니다. 근로소득만 있으면 총급여 5,000만원 이하, 종합소득이면 3,800만원 이하면 서민형이에요.\n\n여기서 포인트가 나옵니다. 한 번 서민형으로 가입해두면 그 뒤에 연봉이 올라도 그 계좌의 400만원 비과세는 그대로 유지된다는 거예요. 소득이 올랐다고 중간에 일반형으로 강등되지 않습니다.\n\n그러니까 사회 초년생이거나, 이직 사이에 소득이 잠깐 줄었거나, 육아휴직으로 급여가 적었던 해가 있다면 그때가 서민형 가입의 골든타임입니다. 나중에 연봉이 오르고 나면 다시는 서민형으로 못 들어가요.\n\n반대로 주의할 것도 있어요. 만기가 되어 연장하거나 재가입할 때는 다시 판정합니다. 그 사이 소득이 올라서 요건에 안 맞으면 그때부터는 일반형이 되는 거죠. 만기 관리할 때 이 부분도 같이 확인해두세요."},

  {t:"퇴직연금 실물이전 — 안 팔고 그대로 증권사로 옮기기", a:"dcpension", g:"퇴직연금,실물이전,IRP,DC형,수수료,증권사이전,ETF",
   b:"IRP나 DC형 퇴직연금을 은행에서 만들었는데 수수료가 아까워서 증권사로 옮기고 싶은 분들 많으시죠. 예전엔 이게 참 번거로웠어요. 옮기려면 들고 있던 ETF와 펀드를 전부 팔아서 현금으로 만든 다음에 이전해야 했거든요. 그 사이에 시장이 오르면 그대로 손해였습니다.\n\n2024년 10월 31일부터 실물이전 서비스가 시행됐습니다. 이제는 보유한 상품을 그대로 둔 채로 다른 금융사로 옮길 수 있어요. 팔지 않으니까 공백도 없고 손실도 없습니다.\n\n다만 조건이 있어요. 같은 유형끼리만 됩니다. DB는 DB로, DC는 DC로, 개인형 IRP는 개인형 IRP로만 이전이 가능해요.\n\n그리고 이전이 안 되는 상품도 꽤 있습니다. 디폴트옵션 전용 상품, 각 금융사가 자체적으로 만든 원리금보장상품, 보험계약 형태의 퇴직연금, 리츠나 지분증권, 사모펀드, ELF 같은 파생결합증권, RP와 MMF, 발행어음, 환매수수료가 붙는 펀드나 환매가 불가능한 펀드 등이 제외 대상이에요.\n\n그래서 실제로는 이렇게 하시면 됩니다. 옮기기 전에 지금 금융사와 옮겨갈 금융사 양쪽에 내가 들고 있는 상품 목록을 주고 실물이전이 되는지 물어보세요. 되는 건 그대로 옮기고, 안 되는 것만 골라서 팔면 됩니다. 대부분 국내 상장 ETF는 문제없이 넘어갑니다."},

  {t:"수확기에 놓치기 쉬운 3가지 (정산특례·배우자 승계·계좌 쪼개기)", a:"mastertips", g:"퇴직소득세,정산특례,연금계좌승계,배우자상속,연금저축,연금개시,은퇴설계",
   b:"연금을 빼 쓸 때가 되면 그제서야 알게 되는 것들이 있습니다. 미리 알아두면 좋은 세 가지를 정리했어요.\n\n먼저 퇴직소득세 정산특례입니다. 과거에 퇴직금 중간정산을 받았거나 이직이 잦았던 분들 얘기예요. 마지막에 퇴사할 때 이전 퇴직금까지 합산해서 신고하면 근속연수를 최초 입사일부터 통산할 수 있습니다. 근속연수공제가 커지니까 세금이 꽤 줄어들 수 있어요. 회사에 예전 퇴직소득 원천징수영수증을 내고 신청하면 됩니다. 다만 선택 사항이라 무조건 유리한 건 아니에요. 중간정산 이후 급여가 크게 올랐다면 오히려 불리할 수도 있으니 두 가지로 계산해서 비교해달라고 요청하세요.\n\n둘째는 연금계좌 배우자 승계입니다. 가입자가 사망하면 계좌를 해지하고 세금을 정산하는 게 보통인데, 배우자에 한해서는 해지하지 않고 승계할 수 있어요. 승계하면 과세이연이 그대로 유지되고 배우자가 계속 연금으로 받습니다. 중요한 건 5년 가입 요건을 고인의 가입일로 보고, 연금수령연차도 사망 당시 고인의 연차를 그대로 이어받는다는 점이에요. 고인이 켜둔 시계를 물려받는 셈입니다. 신청 기한이 사망일이 속한 달의 말일부터 6개월 이내라 정신없는 시기에 놓치기 쉬우니 꼭 기억해두세요.\n\n셋째는 계좌를 미리 쪼개두는 겁니다. 연금저축이나 IRP는 여러 개 가질 수 있어요. 세액공제 한도만 전체 합산으로 볼 뿐입니다. 그리고 계좌마다 연금 개시 시점을 따로 정할 수 있어요. 한 계좌에 다 몰아두면 개시하는 순간 전체가 묶이지만, 두세 개로 나눠두면 A계좌는 55세에 개시해서 연차를 쌓고, B계좌는 계속 납입해서 세액공제를 받고, C계좌는 70세에 개시해서 낮은 세율로 목돈을 빼는 식으로 설계가 됩니다. 연 1,500만원 룰을 관리하기도 훨씬 편해지고요. 새로 만들 거라면 수수료가 낮은 증권사에서 개설하세요."},

  {t:"버블·하락장 미리 잡는 3가지 선행지표 (하이일드·VIX·내부자 매도)", a:"bubble", g:"하이일드스프레드,VIX,공포지수,내부자매도,버블,하락장방어,리밸런싱",
   b:"증시 붕괴는 주가보다 돈의 흐름과 신용시장에서 먼저 신호가 옵니다. 세 가지만 보면 돼요.\n\n가장 중요한 건 하이일드 신용 스프레드입니다. 투기등급 회사채와 국채의 금리차인데, 바닥에서 V자로 튀어 오르면 돈줄이 마른다는 뜻이에요. 평소 3~4%대면 안전, 5~6%로 가파르게 오르면 경계, 두 자릿수면 이미 위기 한복판입니다. 2020년 코로나 때가 그랬죠.\n\n둘째는 공포지수 VIX입니다. 급락과 거의 동시에 가장 빨리 솟는 지표라 20 아래면 평온, 20~30이면 경계, 30~40이면 공포, 40 위는 패닉으로 봅니다.\n\n셋째는 경영진의 대규모 매도예요. 시장 전체에서 CEO나 CFO가 자기 회사를 크게 파는 흐름이죠. 다만 10% 대주주나 사모펀드의 매도는 구조적 청산이라 신호가 약합니다.\n\n신호가 켜지면 절세계좌 안에서 갈아타세요. 팔아도 세금이 바로 안 나옵니다. 성장 비중을 줄이고 파킹형(KOFR·CD금리)과 금현물(ACE KRX금현물), 배당(미국배당다우존스)으로 옮기는 식이에요. 인버스는 단기에 소액만, 현금은 바겐세일 실탄으로 남겨둡니다."},
  ];

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var box = document.getElementById('posts');
  POSTS.forEach(function(p, i){
    var url = SITE + (p.a ? ('#'+p.a) : '');
    var body = p.b + "\n\n전체 내용은 자동 계산기와 실시간 위험신호 차트까지 사이트에 정리해뒀어요.\n" + url + "\n\n이 글은 일반적인 정보이고 투자·세무 자문은 아닙니다. 세법은 바뀔 수 있으니 실행 전 윤세원 세무사(https://blog.naver.com/taxmaster1030) 등 전문가와 확인하세요.";
    var n = i+1;
    var div = document.createElement('div'); div.className='post';
    div.innerHTML =
      '<div class="ph"><span class="num">'+n+'</span>'+
        '<input class="ttl" id="t'+n+'" readonly value="'+p.t.replace(/"/g,'&quot;')+'">'+
        '<button class="cp" onclick="cp(\'t'+n+'\',this)">제목 복사</button></div>'+
      '<textarea id="b'+n+'" readonly>'+esc(body)+'</textarea>'+
      '<div class="row">'+
        '<button class="cp" onclick="cp(\'b'+n+'\',this)">본문 복사</button>'+
        '<input class="tags" id="g'+n+'" readonly value="'+p.g.replace(/"/g,'&quot;')+'">'+
        '<button class="cp" onclick="cp(\'g'+n+'\',this)">태그 복사</button>'+
      '</div>';
    box.appendChild(div);
    var ta = div.querySelector('textarea');
    ta.style.height='auto'; ta.style.height=(ta.scrollHeight+4)+'px';
  });

  function cp(id, btn){
    var el=document.getElementById(id); var txt=(el.value!==undefined?el.value:el.textContent);
    function done(){ var o=btn.textContent; btn.textContent='✓ 복사됨'; btn.classList.add('ok'); setTimeout(function(){btn.textContent=o;btn.classList.remove('ok');},1400); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){el.select&&el.select();document.execCommand('copy');done();}); }
    else { el.select&&el.select(); document.execCommand('copy'); done(); }
  }
</script>
