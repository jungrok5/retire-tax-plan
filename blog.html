<style>
  :root{ --bg:#0b1020; --card:#16203a; --card2:#1b2949; --line:#263456; --text:#e8edf7; --muted:#9aa7c4; --brand:#5b8cff; --green:#2dd4a7; }
  *{box-sizing:border-box} body{margin:0;font-family:"Pretendard",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:880px;margin:0 auto;padding:34px 18px 70px}
  h1{font-size:clamp(22px,4vw,30px);letter-spacing:-.6px;margin:0 0 6px}
  .lead{color:var(--muted);font-size:14.5px;margin:0 0 8px}
  .how{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:#cdd6ea;margin:14px 0 26px}
  .how b{color:var(--text)}
  .post{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:22px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .num{flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(100deg,var(--brand),#7c5cff);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
  input.ttl{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14.5px;font-weight:700;font-family:inherit}
  textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:#e8edf7;border-radius:11px;padding:13px 14px;font-size:14px;line-height:1.7;font-family:inherit;resize:vertical}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  input.tags{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 11px;font-size:12.5px;font-family:inherit}
  button.cp{background:var(--card2);border:1px solid var(--line);color:#cfe0ff;font-weight:700;border-radius:9px;padding:9px 13px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
  button.cp:hover{border-color:var(--brand);color:#fff}
  button.cp.ok{background:var(--green);color:#06281f;border-color:transparent}
  .tag{font-size:11px;color:var(--muted)}
  a{color:#9cb8ff}
</style>

<div class="wrap">
  <h1>📝 네이버 블로그용 글 모음 (복붙용)</h1>
  <p class="lead">아래 글을 하나씩 네이버 블로그에 새 글로 올리세요. 각 항목의 <b>[제목 복사] · [본문 복사] · [태그 복사]</b> 버튼만 누르면 됩니다.</p>
  <div class="how">
    <b>사용법</b> &nbsp;1) 네이버 블로그 → 글쓰기 &nbsp; 2) 여기서 <b>제목 복사</b> → 제목칸에 붙여넣기 &nbsp; 3) <b>본문 복사</b> → 본문에 붙여넣기 &nbsp; 4) <b>태그 복사</b> → 태그칸에 붙여넣기 &nbsp; 5) 발행<br>
    ※ 본문 맨 아래에 <b>전체 보기(사이트) 링크</b>가 포함돼 있어, 방문자가 계산기·실시간 차트가 있는 사이트로 이동합니다. 글은 <b>위에서부터 순서대로</b> 올리면 시리즈가 됩니다.
  </div>

  <!-- 글들이 여기에 -->
  <div id="posts"></div>
</div>

<script>
  var SITE = "https://retire-tax-plan.vercel.app/";
  // 각 글: {t:제목, a:사이트 앵커, g:태그, b:본문(앞부분)}  — 본문 끝에 CTA/면책 자동 부착
  var POSTS = [
  {t:"노후 절세 끝판왕: 연금·ISA·미국주식 '폭포수' 전략 총정리 (2026)", a:"", g:"노후준비,연금저축,IRP,ISA,미국주식,절세,세액공제,재테크",
   b:"노후 준비는 '얼마 버느냐'만큼 '세금을 얼마나 줄이느냐'가 중요합니다. 핵심은 세금 혜택이 큰 계좌부터 순서대로 채우는 '폭포수(Waterfall)' 전략입니다.\n\n[전체 골격]\n① 연금저축 + IRP — 1인 연 900만원까지 (세액공제 13.2~16.5%, 맞벌이 부부면 합산 약 297만원 환급)\n② 중개형 ISA — 연 2,000만원 (비과세·손익통산)\n③ 남는 목돈 — 미국주식 직접투자 (양도세 22% 분리과세, 건강보험료에 0 반영)\n\n[돈이 흐르는 4단계]\n0단계(오늘): 연금계좌에 1만원만 넣어 '5년 타이머'를 켭니다.\n1단계(모으기): 폭포수 순서로 납입하며 국내상장 미국ETF 매수.\n2단계(방어): 부부 명의 분산 + 배당 999만원 컷오프로 건강보험료 폭탄 회피.\n3단계(수확): 55세 이후 저율(3.3~5.5%)로 연금 인출.\n\n계좌 안에서는 'TIGER 미국S&P500' 같은 국내상장 미국ETF(이름에 'H' 없는 환노출)를 삽니다. 일반 계좌에서 사면 배당소득세 15.4% + 건보료에 반영되기 때문입니다."},

  {t:"오늘 연금저축에 '1만원'부터 넣어야 하는 이유 (5년 타이머)", a:"day0", g:"연금저축,IRP,연금계좌개설,5년타이머,노후준비,절세",
   b:"노후 절세에서 '시간'은 절반입니다. 오늘 당장 할 수 있는 단 하나의 행동이 있습니다 — 연금저축(또는 IRP) 계좌를 열고 1만원을 넣는 것.\n\n[왜 1만원인가]\n· 연금을 저율(3.3~5.5%)로 빼 쓰려면 '가입 후 5년 + 만 55세' 요건이 필요합니다.\n· 이 5년 타이머는 '첫 입금일'부터 돌아가기 시작합니다. 미래에 목돈을 넣어도 소급되지 않아요.\n· 그래서 출발선을 오늘 끊는 게 중요합니다. 1,000원도 되지만 잔고가 너무 적으면 휴면계좌로 잠길 수 있어 1만원을 권장합니다.\n\n[프리패스 효과]\n5년이 지난 뒤 ISA에서 굴리던 목돈 1억을 연금계좌로 옮기면, 국세청은 그 1억도 '5년 채운 돈'으로 인정합니다. 이미 55세 이상이라면 넣은 그 달부터 저율로 매달 받을 수 있습니다.\n\n증권사 앱에서 '연금저축펀드' 검색 → 비대면 개설 → 1만원 입금. 5분이면 끝납니다."},

  {t:"폭포수 납입 순서와 '환노출' 미국ETF 종목 고르는 법", a:"waterfall", g:"미국ETF,환노출,TIGER미국S&P500,연금저축,ISA,환헤지,절세",
   b:"투자 가능 금액이 적을 때부터 많을 때까지, 물통을 위에서부터 채우는 원리입니다.\n\n[순서]\n1순위 연금저축+IRP 900만원 → 세액공제부터 확보\n2순위 ISA 2,000만원 → 비과세·손익통산\n3순위 그 이상 → 미국주식 직접투자\n\n[계좌 안에서 뭘 사나]\n연금·ISA 안에서는 'TIGER 미국S&P500', 'TIGER 미국나스닥100' 같은 국내상장 미국ETF를 삽니다. 같은 상품을 일반계좌에서 사면 배당소득세 15.4%를 맞고, 수익이 1,000만원을 넘으면 건강보험료에 100% 반영됩니다.\n\n[왜 '환노출(H 없는)' 인가]\n· 위기로 주가가 폭락할 때 달러 환율이 급등해 손실을 방어하는 '충격 흡수 장치'가 됩니다.\n· 장기적으로 수익률을 갉아먹는 환헤지 비용도 아낍니다.\n· 국내상장 미국ETF는 앱의 원화 주가에 환율이 실시간 반영돼 있어, 매도 시 따로 환율 계산이 필요 없습니다.\n\n부부라면 각자 명의로 나눠 한도를 2배(연금 1,800·ISA 4,000)로 키울 수 있습니다."},

  {t:"DC형 퇴직연금, 뭘 사야 할까? (위험자산 70% 규제 + TDF + 채권혼합)", a:"dcpension", g:"퇴직연금,DC형,IRP,TDF,채권혼합ETF,위험자산70,미국나스닥100",
   b:"회사 퇴직연금을 DC형으로 바꾸면 본인이 직접 굴립니다. 철학은 동일(국내상장 미국 지수ETF)하지만 규제 하나만 알면 됩니다.\n\n[핵심 제약: 위험자산 70% 한도]\n퇴직연금(DC·IRP)은 주식형 같은 위험자산을 최대 70%까지만 담고, 30%는 안전자산으로 채워야 합니다. (개인형 IRP도 동일. 반면 연금저축펀드는 이 규제가 없어 100% 주식형 가능.)\n\n[3가지 운용법]\n① 직접: 미국S&P500/나스닥100 ETF 70% + 국고채·미국채 ETF 30%\n② 적격 TDF로 100%: TDF는 70% 한도 예외 → 'KODEX TDF2050액티브' 등 먼 빈티지로 자동 운용(글라이드패스)\n③ 고급: 지수형 '채권혼합 ETF'(주식 최대 50%)는 안전자산으로 분류 → 안전자산 30% 자리에 넣으면 계좌 전체 주식비중을 이론상 85%까지(예: 1Q/ACE 미국나스닥100미국채혼합50액티브)\n\n[주의] 개별 미국주식 직접매수 불가(ETF·펀드·예금만), 레버리지·인버스 금지, 디폴트옵션 말고 직접 매수지시. TDF의 숫자는 은퇴 목표연도(예 2050=2050년 은퇴 예정)."},

  {t:"왜 '미국주식 직투'인가 — 1억을 벌어도 건보료 0원인 이유", a:"whyus", g:"미국주식,양도소득세,분리과세,건강보험료,종합과세,SCHD,절세",
   b:"ISA·연금 한도를 다 채운 뒤 남는 목돈을 미국주식 직접투자에 넣는 이유를 정리합니다.\n\n① 건보료·종합과세 무풍지대\n미국주식 양도차익은 22% 분리과세로 끝납니다. 1억을 벌든 10억을 벌든 건강보험료 산정에 반영되지 않고, 피부양자 자격도 유지됩니다.\n\n② 수익이 클수록 더 유리\n연 833만원 이하면 250만원 비과세 공제로 세금이 거의 없고, 2,000만원을 넘으면 국내 금융소득종합과세(최고 49.5%)를 피해 22%로 끝낼 수 있어 압도적으로 유리합니다.\n\n③ 압도적 주주환원\n애플·MS 등은 번 돈으로 자사주를 사 소각합니다. 주식 수가 줄어 내 1주의 가치가 가만히 있어도 오릅니다.\n\n④ 환노출 = 위기의 방어막\n폭락 때 달러 강세가 손실을 상쇄합니다.\n\n단, 순서는 지키세요. 미장 직투는 3순위 — 세액공제(연금)·비과세(ISA)를 먼저 챙긴 뒤 남는 돈으로."},

  {t:"건강보험료·종합과세 피하는 법 (부부분산·배당 999만원 컷오프·임의계속가입)", a:"skills", g:"건강보험료,피부양자,배당소득,종합과세,부부분산,임의계속가입,SCHD",
   b:"자산이 커지면 세금보다 '건보료 폭탄'과 '종합과세 합산'이 더 무섭습니다. 시스템적으로 피하는 법.\n\n[부부 명의 분산]\n한국 세금·건보료는 철저히 개인(인별) 과세. 자산을 부부가 반씩 나누면 ISA 방어막 2억(각 1억), 연금·배당 한도 모두 2배가 됩니다.\n\n[배당 999만원 컷오프]\n일반계좌에서 SCHD·JEPQ 같은 미국 배당주를 살 땐 배당을 1인당 세전 999만원 이내로 맞춥니다. 1,000만원을 넘는 순간 전액이 소득에 합산돼 지역가입자 건보료가 급등합니다. 부부 각 999만원이면 합산 약 2,000만원(월 166만원)을 건보료 걱정 없이 만듭니다.\n\n[은퇴 후 건보료]\n· 임의계속가입: 퇴직 후 최대 36개월간 직장가입자 수준 보험료 유지(첫 고지서 납기 2개월 내 신청).\n· 미국주식 양도세(22% 분리과세)와 사적연금은 건보료에 반영되지 않아 깔끔합니다."},

  {t:"연금, 한 해에 얼마까지 빼야 세금 안 터지나 (안전 인출 한도)", a:"withdraw", g:"연금수령,연금소득세,1500만원,종합과세,분리과세,연금인출,은퇴",
   b:"연금을 받을 때 '세금 폭탄 없이 얼마까지' 빼도 되는지 정리합니다. 두 개의 벽 중 낮은 쪽이 안전선입니다.\n\n① 연금수령한도 = [평가액 ÷ (11−연금수령연차)] × 120%\n이 한도 안에서 빼야 저율·감면이 유지되고, 초과분엔 기타소득세 16.5%가 붙습니다. → 한 번에 빼지 말고 10년 이상 나눠 받기.\n\n② 사적연금 1,500만원 저율 한도\n연금저축·IRP의 과세분 합계가 연 1,500만원(월 약 125만)을 넘으면, 초과분에 대해 종합과세 또는 16.5% 분리과세를 선택합니다. 다른 소득이 적은 은퇴자는 1,500을 넘겨도 종합과세가 더 쌀 수 있습니다(적용세율 26.4%↓면 종합 유리).\n\n[꼭 알 점] 이 1,500만원은 사적연금만 — 국민연금 등 공적연금은 별개로 무조건 종합과세, 퇴직금 재원도 별도입니다.\n\n연금소득세율: 55~69세 5.5% · 70~79세 4.4% · 80세~ 3.3%."},

  {t:"연금 고수 비기: 풍차돌리기·인출순서 비상금·퇴직금 IRP로 30~40% 감면", a:"mastertips", g:"풍차돌리기,ISA연금전환,퇴직소득세,IRP,연금저축,추가세액공제,은퇴",
   b:"한 단계 위의 절세·인출 기술 모음입니다.\n\n[ISA → 연금 풍차돌리기]\nISA를 3년 만기에 해지하고 통째로 연금계좌로 옮기면 1,800만원 한도와 무관하게 전액 입금 가능 + 전환액의 10%(최대 300만원)를 추가 세액공제까지 받습니다.\n\n[인출 순서 = 비과세 비상금]\n연금계좌에서 돈이 빠질 때는 ①세액공제 안 받은 원금(비과세) → ②퇴직금 재원 → ③세액공제 받은 원금+수익 순서. 세액공제 한도(900만)를 넘겨 추가납입한 돈은 언제든 비과세로 인출 가능 → 비상금 통장처럼 활용.\n\n[퇴직금은 IRP에서 '연금'으로]\n일시금 대신 연금으로 받으면 퇴직소득세를 10년차까지 70%·11년차부터 60%만 부담 → 약 30~40% 절감. 게다가 건보료에도 반영되지 않습니다.\n\n[국민연금 연기연금]\n최대 5년 미루면 연 7.2%씩, 최대 36% 더 받습니다."},

  {t:"미국주식 절세 3대 기술 + 배우자 증여 단가리셋 (2025 이월과세 주의)", a:"skills", g:"미국주식절세,양도소득세,배우자증여,이월과세,손익통산,250만원공제",
   b:"미국주식 직접투자에서 양도세(22%)를 합법적으로 줄이는 기술들입니다.\n\n① 250만원 비과세 영끌\n연말에 수익 250만원만큼만 팔았다가 다음 날 다시 사서, 매년 기본공제 250만원을 비과세로 챙깁니다.\n\n② 손실 확정(상계)\n손실 난 종목을 연말에 팔아 전체 순수익을 깎아 과세표준을 낮춥니다.\n\n③ 배우자 증여로 단가 리셋\n크게 오른 종목을 배우자에게 증여(10년 6억 비과세)하면 취득단가가 시세로 리셋됩니다.\n⚠️ 단, 2025.1.1 이후 증여분부터 해외주식도 '이월과세' 대상 — 증여 후 1년 이내에 팔면 증여자의 원래 취득가로 계산돼 효과가 사라집니다. 반드시 1년 이상 보유 후 매도하세요. (2024년 증여분까지는 즉시 매도해도 가능했습니다.)\n\n수익 구간 비교: 연 833만원 이하·2,000만원 초과 모두 미국 직투가 유리합니다."},

  {t:"버블·하락장 미리 잡는 3대 선행지표 (하이일드·VIX·내부자 매도)", a:"bubble", g:"하이일드스프레드,VIX,공포지수,내부자매도,버블,하락장방어,리밸런싱",
   b:"붕괴는 주가보다 '돈의 흐름'과 '신용시장'에서 먼저 균열을 보입니다. 한눈에 보는 3대 신호.\n\n① 하이일드 신용 스프레드 (1순위)\n투기등급 회사채와 국채의 금리차. 바닥에서 V자로 급등하면 자금경색 신호. 평소 3~4%대면 안전, 5~6%↑로 가파르면 경계, 두 자릿수면 위기 한복판(예: 2020 코로나).\n\n② 공포지수 VIX\n급락과 거의 동시에 가장 빨리 치솟는 게이지. ~20 평온 / 20~30 경계 / 30~40 공포 / 40+ 패닉.\n\n③ 내부자(경영진) 대규모 매도\n시장 전체에서 CEO·CFO·이사가 자기 회사를 크게 파는 흐름. 단, 10% 대주주·PE의 매도는 구조적 청산이라 신호가 약합니다.\n\n[신호 켜지면 방어 리밸런싱]\n절세계좌 안에서 갈아타면 세금이 즉시 발생하지 않습니다. 성장 비중↓ + 파킹형(KOFR·CD금리)·금현물(ACE KRX금현물)·배당(미국배당다우존스)으로 분산. 인버스는 단기·소액만, 현금은 '바겐세일 실탄'."},
  ];

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var box = document.getElementById('posts');
  POSTS.forEach(function(p, i){
    var url = SITE + (p.a ? ('#'+p.a) : '');
    var body = p.b + "\n\n────────────\n👉 전체 내용(자동 계산기·실시간 위험신호 차트 포함)은 여기서 확인하세요:\n" + url + "\n\n※ 본 글은 일반적인 정보 제공·교육용이며 투자·세무 자문이 아닙니다. 세법은 개정될 수 있으니 실행 전 세무사·전문가와 확인하세요.";
    var n = i+1;
    var div = document.createElement('div'); div.className='post';
    div.innerHTML =
      '<div class="ph"><span class="num">'+n+'</span>'+
        '<input class="ttl" id="t'+n+'" readonly value="'+p.t.replace(/"/g,'&quot;')+'">'+
        '<button class="cp" onclick="cp(\'t'+n+'\',this)">제목 복사</button></div>'+
      '<textarea id="b'+n+'" readonly>'+esc(body)+'</textarea>'+
      '<div class="row">'+
        '<button class="cp" onclick="cp(\'b'+n+'\',this)">본문 복사</button>'+
        '<input class="tags" id="g'+n+'" readonly value="'+p.g.replace(/"/g,'&quot;')+'">'+
        '<button class="cp" onclick="cp(\'g'+n+'\',this)">태그 복사</button>'+
      '</div>';
    box.appendChild(div);
    var ta = div.querySelector('textarea');
    ta.style.height='auto'; ta.style.height=(ta.scrollHeight+4)+'px';
  });

  function cp(id, btn){
    var el=document.getElementById(id); var txt=(el.value!==undefined?el.value:el.textContent);
    function done(){ var o=btn.textContent; btn.textContent='✓ 복사됨'; btn.classList.add('ok'); setTimeout(function(){btn.textContent=o;btn.classList.remove('ok');},1400); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){el.select&&el.select();document.execCommand('copy');done();}); }
    else { el.select&&el.select(); document.execCommand('copy'); done(); }
  }
</script>
