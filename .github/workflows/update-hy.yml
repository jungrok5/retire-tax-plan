name: Update HY spread data

# 하이일드 스프레드(FRED 공식 API)를 매일 받아 hy-data.json으로 커밋.
# graph CSV는 봇 다운로드를 막으므로 공식 API 사용(키 필요, GitHub Secret에 보관 → 사용자 노출 X).
# 사용자 요청 때마다 FRED를 치지 않으니 레이트리밋 0.
#
# 준비: FRED 무료 키 발급 https://fred.stlouisfed.org/docs/api/api_key.html
#       → 저장소 Settings → Secrets and variables → Actions → New secret
#         name=FRED_API_KEY, value=발급키

on:
  schedule:
    - cron: '0 13 * * *'   # 매일 13:00 UTC (22:00 KST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hy
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FRED API & build hy-data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::warning::FRED_API_KEY 시크릿이 없습니다 — 기존 hy-data.json 유지"; exit 0
          fi
          curl --http1.1 -fsS -m 40 --retry 5 --retry-delay 4 --retry-all-errors \
            "https://api.stlouisfed.org/fred/series/observations?series_id=BAMLH0A0HYM2&api_key=${FRED_API_KEY}&file_type=json&observation_start=2018-01-01" \
            -o hy.json || echo "::warning::FRED API fetch 실패"
          python3 - <<'PY'
          import json, datetime, os, sys
          if not os.path.exists('hy.json'):
              print("no hy.json -> keep existing"); sys.exit(0)
          try:
              obs = json.load(open('hy.json')).get('observations', [])
          except Exception as e:
              print("parse fail -> keep:", e); sys.exit(0)
          month={}; latest=None
          for o in obs:
              d=o.get('date',''); v=o.get('value','.')
              if not d or v in ('.','',None): continue
              try: val=float(v)
              except: continue
              month[d[:7]]=val; latest={"date":d,"value":val}
          monthly=[[k,month[k]] for k in sorted(month)]
          if len(monthly) < 6 or not latest:
              print("empty -> keep existing"); sys.exit(0)
          json.dump({"monthly":monthly,"latest":latest,"updated":datetime.datetime.utcnow().isoformat()+"Z"},
                    open("hy-data.json","w"))
          print("wrote", len(monthly), "months, latest", latest)
          PY
          rm -f hy.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hy-data.json
          git diff --staged --quiet || git commit -m "chore: update HY spread data [skip ci]"
          git push
