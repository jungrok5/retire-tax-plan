<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161033"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.6" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#1a2547" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a2547" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <g font-family="'Noto Sans CJK KR', Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <text x="80" y="150" font-size="30" font-weight="700" fill="#bcd0ff">연금 · ISA · 미국주식 통합 절세 전략</text>
    <text x="80" y="270" font-size="84" font-weight="900" fill="#e8edf7">궁극의 노후 절세</text>
    <text x="80" y="372" font-size="84" font-weight="900" fill="url(#grad)">마스터플랜</text>
    <text x="80" y="452" font-size="34" font-weight="600" fill="#9aa7c4">나이별 · 투자금 규모별 · 시간 흐름별 액션을 한눈에</text>

    <g transform="translate(80,510)">
      <rect x="0" y="0" width="330" height="64" rx="14" fill="#16203a" stroke="#263456"/>
      <text x="24" y="41" font-size="26" font-weight="800" fill="#2dd4a7">연금 900</text>
      <text x="170" y="41" font-size="26" fill="#9aa7c4">→ 1순위</text>

      <rect x="350" y="0" width="330" height="64" rx="14" fill="#16203a" stroke="#263456"/>
      <text x="374" y="41" font-size="26" font-weight="800" fill="#5b8cff">ISA 2,000</text>
      <text x="540" y="41" font-size="26" fill="#9aa7c4">→ 2순위</text>

      <rect x="700" y="0" width="360" height="64" rx="14" fill="#16203a" stroke="#263456"/>
      <text x="724" y="41" font-size="26" font-weight="800" fill="#7c5cff">미장 직투</text>
      <text x="880" y="41" font-size="26" fill="#9aa7c4">→ 3순위</text>
    </g>

    <text x="1120" y="600" font-size="24" font-weight="600" fill="#ffd166" text-anchor="end">2025~2026 개정세법 반영</text>
  </g>
</svg>
